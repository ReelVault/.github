name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search
        [existing issues](../issues) first to avoid duplicates.

        Security vulnerabilities should **not** be reported here — see
        [SECURITY.md](https://github.com/ReelVault/.github/blob/main/SECURITY.md)
        instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The minimal steps needed to reproduce this reliably.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: ReelVault server/client version, or commit hash if built from source.
      placeholder: e.g. v1.2.3
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Docker
        - From source (bun dev)
        - Release binary / installer
        - Desktop app (Tauri)
        - Other (specify below)
    validations:
      required: true

  - type: textarea
    id: environment-details
    attributes:
      label: Environment details
      description: OS, browser (if relevant), ffmpeg version, or anything else that might matter.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant server/browser console output. This will be rendered as code automatically.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, related issues, anything else useful.
